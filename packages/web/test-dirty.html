<script>
// Simulate exactly what the edit page does
const FIELDS = [
  { key: "title", type: "text" },
  { key: "description", type: "textarea" },
  { key: "seriesIndex", type: "number" },
  { key: "year", type: "number" },
  { key: "isbn", type: "text" },
  { key: "pageCount", type: "number" },
];

// Simulate book data
const bookData = {
  title: "Drei",
  description: "A cool book about stuff",
  seriesIndex: 2,
  year: 1991,
  isbn: null,
  pageCount: 400,
};

// Initialize values (same as useEffect)
const initialValues = {};
const values = {};
for (const { key } of FIELDS) {
  const val = bookData[key];
  initialValues[key] = val != null ? String(val) : "";
  values[key] = initialValues[key];
}

console.log("Initial values:", JSON.stringify(initialValues));
console.log("Values before change:", JSON.stringify(values));

// Simulate clearing description
values["description"] = "";

console.log("Values after clearing description:", JSON.stringify(values));

// isDirty check
const isDirty = Object.keys(values).some((k) => values[k] !== initialValues[k]);
console.log("isDirty:", isDirty);
console.log("description changed:", values["description"] !== initialValues["description"]);
</script>
